<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MotoVlog 企劃扭蛋機</title>
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: #1a1a20;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --accent: #ff3333; /* Honda Red */
      --accent-glow: rgba(255, 51, 51, 0.2);
      --tag-bg: #2c2c35;
    }
    
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent;}
    
    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 50%);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    .app-container {
      width: 100%;
      max-width: 500px;
    }

    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 32px; margin: 0 0 5px 0; font-weight: 800; letter-spacing: 1px; }
    .header h1 span { color: var(--accent); }
    .header p { margin: 0; color: var(--text-sub); font-size: 15px; }

    /* 扭蛋機展示區 */
    .gacha-machine {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 24px;
      padding: 30px 25px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部裝飾線 */
    .gacha-machine::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: var(--accent);
    }

    .tags { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    .tag { background: var(--tag-bg); color: #ccc; font-size: 12px; padding: 5px 12px; border-radius: 20px; letter-spacing: 1px; }

    .idea-title { font-size: 24px; font-weight: bold; margin: 0 0 15px 0; line-height: 1.3; }
    .idea-desc { font-size: 15px; color: #a1a1aa; line-height: 1.6; margin: 0 0 20px 0; text-align: justify; }
    
    .idea-angle {
      background: rgba(255, 51, 51, 0.1);
      border: 1px solid rgba(255, 51, 51, 0.3);
      color: #ff6b6b;
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
    }

    .generate-btn {
      background: var(--accent); color: white; border: none; width: 100%; padding: 18px;
      font-size: 18px; font-weight: bold; border-radius: 16px; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 10px 20px var(--accent-glow);
    }
    .generate-btn:active { transform: scale(0.96); box-shadow: none; }

    /* 動畫效果 */
    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 初始狀態提示 */
    .initial-state { color: #555; font-size: 60px; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="header">
    <h1>MotoVlog <span>企劃扭蛋機</span></h1>
    <p>專屬車頭 360 機位 · 一鍵抽取拍攝靈感</p>
  </div>

  <div class="gacha-machine" id="display-area">
    <div class="initial-state">🎲</div>
    <div style="color: var(--text-sub); font-size: 16px;">點擊下方按鈕<br>抽取今日專屬的拍攝企劃</div>
  </div>
  
  <button class="generate-btn" onclick="rollIdea()">抽取拍攝主題</button>

</div>

<script>
  // 專為「車頭相機架 + 360相機」度身訂造的拍攝主題庫
  const ideas = [
    {
      tags: ["#P牌日常", "#對話Vlog"],
      title: "P牌上路：新手內心獨白",
      desc: "一邊騎車一邊分享今天遇到的路況、P牌的壓力或駕駛心得。真誠的碎碎念最容易引起本地車友共鳴。",
      angle: "🎥 360 後期取景：將視角 100% 轉向自己（騎士視角），營造面對面聊天的親切感。"
    },
    {
      tags: ["#ASMR", "#排氣聲浪"],
      title: "隧道狂想曲：Rebel 500 聲浪",
      desc: "不加任何背景音樂，純粹紀錄 Rebel 500 在不同隧道內的排氣聲與迴音。這類 ASMR 影片在國外有極高的長尾流量。",
      angle: "🎥 360 後期取景：視角朝前看路，使用超廣角 (Ultra Wide)，讓畫面有極強的速度感。"
    },
    {
      tags: ["#視覺衝擊", "#Insta360專屬"],
      title: "小行星模式：穿梭都市叢林",
      desc: "利用 Insta360 獨有的視覺效果，在經過高樓大廈密集區（如旺角、中環）時，將畫面變成一顆滾動的星球。",
      angle: "🎥 360 後期取景：在 App 內選擇「小行星 (Tiny Planet)」特效，相機固定車頭即可完美達成。"
    },
    {
      tags: ["#KeeTa日常", "#縮時攝影"],
      title: "外賣車手 Hustle 日常 (TimeShift)",
      desc: "紀錄連續接單、穿梭橫街窄巷的過程。將長達 30 分鐘的騎乘過程，後期加速成 1 分鐘的快節奏短片。",
      angle: "🎥 360 後期取景：視角朝前，在 Insta360 App 使用 TimeShift 功能加速，畫面會極度平穩流暢。"
    },
    {
      tags: ["#夜間騎乘", "#Cyberpunk"],
      title: "香港夜遊：霓虹燈下的巡航",
      desc: "在晚間挑選招牌密集的街道慢騎。Rebel 500 的街車風格配上香港夜景，自帶濃厚的 Cyberpunk 電影感。",
      angle: "🎥 360 後期取景：視角朝前，可開啟低光防震模式，稍微拉慢快門營造車燈的光軌感。"
    },
    {
      tags: ["#防衛駕駛", "#實用教學"],
      title: "車Cam實錄：香港地獄路況",
      desc: "剪輯日常騎乘遇到的突發狀況（如小巴硬cut、盲毛過馬路），並用語音事後配音，分析如何預判危險。",
      angle: "🎥 360 後期取景：視角鎖定正前方，遇到突發狀況時，利用關鍵幀 (Keyframe) 放大焦點。"
    },
    {
      tags: ["#靜態展示", "#改裝分享"],
      title: "愛車特寫：排氣喉與外觀改裝",
      desc: "將車停泊在風景優美的地方，針對你的改裝件（如 Coffman's / Two Brothers 喉）進行解說，不一定要邊騎邊拍。",
      angle: "🎥 建議機位：將相機連自拍桿從車頭架拆下，手持圍繞車身走一圈，後期做平滑運鏡。"
    },
    {
      tags: ["#互動遊戲", "#短影音"],
      title: "第一視角：你會點樣行？",
      desc: "在複雜路口或迴旋處前暫停畫面，拋出問題問觀眾「如果是你，你會選哪條線？」，增加 Shorts/Reels 的留言互動率。",
      angle: "🎥 360 後期取景：標準向前視角，配合剪輯軟體加上大字體問句與倒數計時。"
    },
    {
      tags: ["#風景打卡", "#假日遊車河"],
      title: "遠離市區：尋找隱世靚景",
      desc: "紀錄探索大帽山、鹿頸或新界偏遠路段的過程。主打慢節奏、放鬆的心情，配上 Chill 氛圍的 Lo-Fi 音樂。",
      angle: "🎥 360 後期取景：利用「自由視角 (FreeCapture)」在風景與騎士之間來回切換運鏡。"
    },
    {
      tags: ["#多視角", "#剪輯技巧"],
      title: "一人多機位：分屏對比效果",
      desc: "利用 X4 360 鏡頭能同時拍下前後的特性。在剪輯時將畫面上下分屏，上面看前方路況，下面看你的駕駛反應。",
      angle: "🎥 360 後期取景：輸出兩次影片（一次朝前、一次朝自己），在剪片 App 內疊加成上下分屏。"
    }
  ];

  let lastIndex = -1;

  function rollIdea() {
    const displayArea = document.getElementById('display-area');
    
    // 移除動畫以便重觸發
    displayArea.classList.remove('fade-in');
    
    // 加入震動特效模擬扭蛋
    displayArea.classList.add('shake');
    
    // 確保不會連續抽到同一個
    let randomIndex;
    do {
      randomIndex = Math.floor(Math.random() * ideas.length);
    } while (randomIndex === lastIndex && ideas.length > 1);
    lastIndex = randomIndex;
    
    const idea = ideas[randomIndex];
    const tagsHtml = idea.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

    setTimeout(() => {
      displayArea.classList.remove('shake');
      
      // 更新內容並加入淡入特效
      displayArea.innerHTML = `
        <div class="tags">${tagsHtml}</div>
        <div class="idea-title">${idea.title}</div>
        <div class="idea-desc">${idea.desc}</div>
        <div class="idea-angle">
          <div>${idea.angle}</div>
        </div>
      `;
      displayArea.classList.add('fade-in');
    }, 400); // 震動 0.4 秒後出結果
  }
</script>

</body>
</html>
